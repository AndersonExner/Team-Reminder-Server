name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: auth_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d auth_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEAMREMINDER_TEST_DATABASE: Host=localhost;Port=5432;Database=auth_tests;Username=postgres;Password=ci-test-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test TeamReminder.Server.slnx -c Release
