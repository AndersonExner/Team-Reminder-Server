services:
  api:
    build: .
    ports:
      - "127.0.0.1:5080:8080"
    environment:
      ConnectionStrings__Database: "Host=db;Database=teamreminder;Username=teamreminder;Password=${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no arquivo .env}"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: teamreminder
      POSTGRES_USER: teamreminder
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no arquivo .env}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamreminder -d teamreminder"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:
